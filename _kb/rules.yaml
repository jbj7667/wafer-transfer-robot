sensors:
  only_issued: true
  line_tracker:
    model: "YwRobot S033 3채널 (SEN040133 / 공지 SEN200620)"
    max_count: 1
    output: "디지털(74HC14) — 흑=LOW, 백=HIGH. SW 임계값 조절 불가"
    size_mm: [66, 24]
    tuning: ["5V vs 3.3V", "높이 5~15mm", "기울기 0/5/10/15°", "차광 후드"]
  ir_distance: {model: GP2Y0A41SK0F, range_mm: [40, 300], max_count: 3, issued: 1}
  ultrasonic: {model: HC-SR04, range_mm: [20, 4500], max_count: 3, issued: 1}
  switches: "리밋·푸시 스위치 구매·수량 무제한"
  wafer_position_input: "본선에서 스마트폰·딥스위치·점퍼로 위치 사전설정 금지 → 센서 자율판단"
  src: FAQ-CIR, SIZE, 라인센서 PDF, Q&A 06

competition:
  prelim:
    time_limit_s: 120
    task: "왼쪽 베이스(1,3,5) 웨이퍼 3개 → 맞은편(2,4,6) → 도착구역 정지"
    scoring: "이송 수 + 시간내 완주 +1 (최대 4)"
    runs: 2
    tiebreak: [1·2차 합산, 가벼운 로봇, 출발 시 부피 작은 로봇, 추첨]
    advance: 상위 24팀
  final:
    time_limit_s: 150
    format: "1:1 토너먼트, 3개 이송 후 먼저 도착하면 즉시 승리"
    wafer_layout: "경기 직전 무작위 → 자율 감지 필수"
    zero_zero: "양팀 탈락(4강 이후 1회 재경기)"
  restart: "최대 2회, 터치 시 의무, 3번째 0점, 득점 무효·웨이퍼 재배치"
  setup_time_s: 30
  robot_impound: "경기 30분 전 제출, 이후 개조 불가(16강 이후 파손부 수리만)"
  src: OP p10-p12

