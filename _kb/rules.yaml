# 2026 창의과제 · 동양로봇경진대회(웨이퍼 이송로봇 부문) — 정형화 규정 DB
# 모든 항목은 src(원문 위치)를 가진다. 원문: _kb/sources/<경로>.md
# 약어: OP = 운영계획 PDF(9/1판), FAQ-ADD = 추가기능 FAQ(10/13), FAQ-CIR = 회로·프로그램 FAQ,
#       FAQ-MECH = 기구 FAQ(9/2), FAB = 가공 운영기준(10/6), SIZE = 주요부품사이즈 PPTX
# status: confirmed(원문 명시) | inferred(도면·정황 추론, 실측 확인 필요) | open(미확정)

meta:
  team: {id: A12, name: "정비제 (1인 참가, 소속 A12 MCA)", advisor: 황일규, note: "전공동아리 대체이수자의 자발적 참가"}
  extracted_on: 2026-10-26
  rule_version: "운영계획 2026-09-01 (8/28 부품표 수정, 8/31 라인끝 반원형, 9/1 12만원 사비 명확화)"
  competition_date: "2026-11-24 13:00-17:00, 1호관 5층 소강당"
  mock_field: "4호관 5층 복도 (10/14 공지: 출발점에서 가장 먼 베이스 2개 높이 오차, 수정 예정)"

field:
  size_mm: [2000, 1000]          # 상대 구역 1m x 1m + 자기 구역 1m x 1m, 펜스 없음
  own_area_mm: [1000, 1000]
  line_width_mm: 19
  tolerance_mm: 1                # 명시 치수 ±1, 미명시 치수는 변경 가능
  line_end_shape: "반원형(끝단 R9.5)"
  start_finish_zone:
    same_zone: true
    marker: "폭19 x 길이100 수직선"
    marker_pos_mm: {x_from_left: 130, y_from_bottom: 130}
    arrival_rule: "로봇 몸체가 100mm 수직선을 일부라도 덮은 채 정지하면 인정"
  trunk:
    x_mm: 500
    to_start: "트렁크 하단에서 R100 곡선 → 출발선(x=130)까지 수평"
    vertical_len_below_rows_mm: 500
  rows:  # y는 구역 상단 기준
    - {row: top,    y_mm: 130, stop_span_mm: 540, base_span_mm: 740, bases: [5, 6], height_mm: 175}
    - {row: middle, y_mm: 305, stop_span_mm: 440, base_span_mm: 640, bases: [3, 4], height_mm: 200}
    - {row: bottom, y_mm: 480, stop_span_mm: 340, base_span_mm: 540, bases: [1, 2], height_mm: 200}
  row_note: "같은 행의 좌우 베이스 높이 동일 → 이송 중 높이 변경 불필요 (inferred, OP p8 번호배치)"
  stop_line: {width_mm: 19, length_mm: 100, offset_from_base_center_mm: 100}
  src: OP p7-p8

wafer_base:
  fixed_to_field: false
  lower_cylinder: {dia_mm: 100, height_mm: 100}
  upper_cylinder:
    base_1_4: {dia_mm: 50, height_mm: 100, total_mm: 200}
    base_5_6: {dia_mm: 50, height_mm: 75,  total_mm: 175}
  top_center_feature: {status: confirmed, value: none, note: "핀 없음·평면 (2026-10-26 모의경기장 확인). CD는 Ø50 상단면에 얹혀 있음"}
  src: OP p7-p8

wafer:
  substitute: CD
  dia_mm: 120
  thickness_mm: 1.2
  center_hole_mm: 15
  overhang_beyond_upper_cyl_mm: 35
  count: 3
  src: OP p7

robot:
  start_envelope_mm: [250, 250, 250]
  self_built: "지급품·키트 외 완제품/로봇키트/외주가공 금지"
  cots_allowed: [일반기어, 랙앤피니언, 바퀴, 축체결부품, 볼트, 너트, 스위치]
  joining: "볼트/너트 권장, 접착제 허용"
  team_label_required: true
  autonomous_after_start: true
  src: OP p9, FAQ-MECH

