              rating: {status: inferred, note: "동계열 SF2421-10B41 = 1A, 3.6Ω/상, 24V급. 실측 필요"}}
    rc_servo: {issued: 0, note: "사비 구매 가능, 초기화 점수 불인정"}
  dc_motor_dims: {dia_mm: 37, shaft_mm: 6, shaft_len_mm: 21, mount: "3-M3 탭 PCD31",
                  warning: "고정볼트가 탭 깊이보다 길면 모터 고장"}
  dc_motor_ratio_table_12V: {38: "200rpm/1.0kgcm", 50: "150/1.1", 75: "100/1.5", 94: "80/2.0", 150: "50/2.0"}
  src: OP p9/p13, SIZE s9-s12

electronics:
  controller: "Arduino Mega 2560 + IO Sensor Shield S (지급품만, 최대높이 27, 102x54)"
  motor_driver: {model: "L298 모듈 SZH-EK001", issued: 2, extra: 1, size_mm: [43.5, 43.5, 29], hole_pitch_mm: 37}
