    issued: "A4988 (1, 추가 2)"
    issue: "A4988 VMOT 최소 8V > 충전지 6셀 7.2V → DRV8834로 교체 지급(10/22경)"
    src: Q&A 10
  power:
    rule: "AA 6개 직렬, 제어·모터 별도 팩 가능, 각 팩 전원스위치 필수"
    pack_ctrl: "AA 건전지 6 (9V) → Arduino"
    pack_motor: "AA 충전지 6 (NiMH 7.2V) → L298/DRV8834"
    holder_mm: [90, 58, 16]
