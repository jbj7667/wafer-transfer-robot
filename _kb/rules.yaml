  - {id: F2, name: 푸시 스위치 출발, must: "로봇 부착 푸시 스위치"}
  - {id: F3, name: 스마트폰 전압 모니터링, must: "자체 앱 표시", not_accepted: "BT 터미널 앱"}
  - {id: F4, name: 전원 On 자체 초기화, must: "센서로 초기상태 설정(리밋 호밍 등)", not_accepted: ["초기화 불필요 구조", "RC서보 단순 구동"]}
  - {id: F5, name: 도착 알림 LED, must: "외관 LED, 이동 중 Off, 시작·도착 구역에서 4Hz 계속 점멸"}

